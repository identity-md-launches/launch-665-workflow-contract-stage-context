# Haunted Liquidity Pool - Foundry configuration.
#
# Everything needed to build and test is vendored under lib/ as ordinary files (forge-std,
# OpenZeppelin Contracts 5.7.0, Uniswap v4-core 1.0.2 and its solmate dependency), so the project
# compiles and tests fully offline once solc 0.8.26 is in the local Foundry cache. No ffi, no
# filesystem permissions, no external compiler binary.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

solc = "0.8.26"
# The Uniswap v4 PoolManager uses transient storage (EIP-1153), so Cancun is required to run the
# integration tests. Sepolia has been Cancun-capable since the Dencun fork.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# Deterministic creation code: no metadata hash appended, so the attested bytecode depends only on
# the sources and the compiler settings, not on file paths.
bytecode_hash = "none"

ffi = false
fs_permissions = []

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 48
depth = 32
fail_on_revert = true

[lint]
# The vaults enforce cooldowns, which is a block.timestamp comparison by definition (a builder can
# shift a timestamp by seconds; the README documents that this only delays a payout). The hook logs
# the result of each vault call after making it, which is the point of those events.
exclude_lints = ["block-timestamp", "reentrancy-events"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
